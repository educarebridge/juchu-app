<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>部門マスタ 登録・編集</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .nav-links { margin-bottom: 20px; }
        .nav-links a { margin-right: 15px; text-decoration: none; color: #0066cc; font-weight: bold; }
        .form-section { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-bottom: 25px; width: 450px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: inline-block; width: 120px; }
        .form-group input { padding: 4px; }
        table { border-collapse: collapse; width: 500px; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #eee; }
        .actions a { margin-right: 8px; color: #0066cc; text-decoration: none; }
        .actions a.delete { color: #cc0000; }
    </style>
</head>
<body>

    <!-- 画面上部のナビゲーションリンク -->
    <div class="nav-links">
        <a th:href="@{/}">← メインメニューへ戻る</a>
        <a th:href="@{/juchu/slip}">➔ 受注伝票入力へ戻る</a>
    </div>

    <h2>部門マスタ 登録・編集</h2>

    <!-- 入力・編集フォーム -->
    <div class="form-section">
        <form th:action="@{/bumon/save}" th:object="${bumonForm}" method="post">
            <div class="form-group">
                <label for="bumonNo">部門コード:</label>
                <!-- 編集時は主キーを変更不可にする -->
                <input type="number" id="bumonNo" th:field="*{bumonNo}" th:readonly="${isEdit}" required />
            </div>
            <div class="form-group">
                <label for="bumonName">部門名:</label>
                <input type="text" id="bumonName" th:field="*{bumonName}" required />
            </div>
            <div style="margin-top: 15px;">
                <button type="submit">保存する</button>
                <a th:href="@{/bumon/list}"><button type="button">クリア</button></a>
            </div>
        </form>
    </div>

    <!-- 部門一覧テーブル -->
    <h3>部門一覧</h3>
    <table>
        <thead>
            <tr>
                <th>部門コード</th>
                <th>部門名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="bumon : ${bumonList}">
                <td th:text="${bumon.bumonNo}"></td>
                <td th:text="${bumon.bumonName}"></td>
                <td class="actions">
                    <a th:href="@{/bumon/edit/{no}(no=${bumon.bumonNo})}">編集</a> |
                    <a th:href="@{/bumon/delete/{no}(no=${bumon.bumonNo})}" class="delete" onclick="return confirm('本当に削除しますか？');">削除</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bumonList)}">
                <td colspan="3" style="text-align: center;">データがありません</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
