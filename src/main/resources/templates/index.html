<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>受注管理システム - メインメニュー</title>
    <style>
        /* 全体背景と基本設定 */
        body {
            font-family: "Helvetica Neue", Arial, "メイリオ", meiryo, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #eef2f7;
            color: #333;
        }

        /* 全体コンテナ（ワイド表示） */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1a252f;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }

        /* 3列グリッドレイアウト（1列目を少し狭く設定） */
        .menu-grid {
            display: grid;
            grid-template-columns: 0.9fr 1fr 1fr; /* 1列目:2列目:3列目の幅比率 */
            gap: 20px;
        }

        /* 列ごとのブロック設定 */
        .menu-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 各列のセクション見出し */
        .column-title {
            font-size: 16px;
            font-weight: bold;
            color: #495057;
            text-align: center;
            padding: 8px;
            background-color: #e9ecef;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        /* ボタン共通デザイン（大きさを完全に統一） */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px; /* 高さ統一 */
            padding: 0 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            box-sizing: border-box;
            text-align: center;
        }

        /* ホバー時の挙動（浮き上がるアニメーション） */
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.18);
            filter: brightness(1.08);
        }

        /* --- 1列目：メイン機能（ブルー / グレー基調） --- */
        .btn-primary    { background-color: #007bff; }
        .btn-info       { background-color: #17a2b8; }
        .btn-secondary  { background-color: #6c757d; }
        .btn-disabled   { background-color: #ced4da; color: #6c757d; pointer-events: none; box-shadow: none; }
        
        /* ★ド派手なパワフルCSVボタン（ネオンパープル〜マゼンタグラデーション） */
        .btn-csv { 
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            box-shadow: 0 4px 12px rgba(142, 45, 226, 0.4);
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        .btn-csv:hover {
            box-shadow: 0 6px 18px rgba(142, 45, 226, 0.6);
        }

        .btn-logout     { background-color: #495057; }

        /* --- 2列目：基本マスター（緑のグラデーション：濃→薄） --- */
        .btn-green-1 { background-color: #1b5e20; } /* お得意先 */
        .btn-green-2 { background-color: #2e7d32; } /* 部門 */
        .btn-green-3 { background-color: #388e3c; } /* 店舗 */
        .btn-green-4 { background-color: #43a047; } /* 商品 */
        .btn-green-5 { background-color: #4caf50; } /* 担当 */
        .btn-green-6 { background-color: #66bb6a; } /* センター */
        .btn-green-7 { background-color: #81c784; color: #1b5e20; } /* 便 */

        /* --- 3列目：属性マスター（オレンジ・黄色グラデーション：濃→薄） --- */
        .btn-orange-1 { background-color: #e65100; } /* 商品ラベル */
        .btn-orange-2 { background-color: #f57c00; } /* 品目 */
        .btn-orange-3 { background-color: #ff9800; } /* 産地 */
        .btn-orange-4 { background-color: #ffa726; color: #4e2600; } /* ドレッシング */

    </style>
</head>
<body>

<div class="menu-container">
    <h1>受注管理システム - メインメニュー</h1>

    <div class="menu-grid">
        
        <!-- 1列目：主要業務機能 -->
        
<div class="menu-column">
    <div class="column-title">業務メニュー</div>

    <!-- 受注伝票入力一覧 -->
    <a th:href="@{/order/list}"
       class="menu-btn btn-info">
        受注伝票入力一覧
    </a>

    <!-- 受注伝票入力 -->
    <a th:href="@{/juchu/slip}"
       class="menu-btn btn-primary">
        受注伝票入力
    </a>

    <!-- CSVデータ書出し（未作成） -->
    <a href="#"
       class="menu-btn btn-disabled"
       onclick="alert('工事中です'); return false;">
        CSVデータ書出し
    </a>

    <!-- CSVデータ読込み -->
    <a th:href="@{/csv/menu}"
       class="menu-btn btn-csv">
        CSVデータ読込み
    </a>

    <div style="margin-top: auto;"></div>

    <!-- ログアウト -->
    <a th:href="@{/logout}"
       class="menu-btn btn-logout">
        ログアウト
    </a>
</div>

        <!-- 2列目：基本マスター（緑グラデーション） -->
        <div class="menu-column">
            <div class="column-title">基本マスター</div>
            <a th:href="@{/tokuisaki/list}" class="menu-btn btn-green-1">お得意先マスター</a>
            <a th:href="@{/bumon/list}" class="menu-btn btn-green-2">部門マスター</a>
            <a th:href="@{/tenpo/list}" class="menu-btn btn-green-3">店舗マスター</a>
            <a th:href="@{/shohin/list}" class="menu-btn btn-green-4">商品マスター</a>
            <a th:href="@{/tanto/list}" class="menu-btn btn-green-5">担当マスター</a>
            <a th:href="@{/center/list}" class="menu-btn btn-green-6">センターマスター</a>
            <a th:href="@{/bin/list}" class="menu-btn btn-green-7">便マスター</a>
        </div>

        <!-- 3列目：属性マスター（オレンジグラデーション） -->
        <div class="menu-column">
            <div class="column-title">品目・属性マスター</div>
            <a th:href="@{/shohin-label/list}" class="menu-btn btn-orange-1">商品ラベルマスター</a>
            <a th:href="@{/hinmoku/list}" class="menu-btn btn-orange-2">品目マスター</a>
            <a th:href="@{/sanchi/list}" class="menu-btn btn-orange-3">産地マスター</a>
            <a th:href="@{/dressing/list}" class="menu-btn btn-orange-4">ドレッシングマスター</a>
        </div>

    </div>
</div>

</body>
</html>
