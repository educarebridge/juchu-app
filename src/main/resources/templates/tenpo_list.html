<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店舗マスタ管理</title>

    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        .form-section { background: #fafafa; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; width: 450px; }

        /* ナビゲーションリンク用CSS */
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin-right: 15px;
            text-decoration: none;
            color: #0066cc;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

    <!-- 画面上部のナビゲーションリンク -->
    <div class="nav-links">
        <a th:href="@{/}">← メインメニューへ戻る</a>
        <a th:href="@{/juchu/slip}">➔ 受注伝票入力へ戻る</a>
    </div>

    <h2>店舗マスタ 登録・編集</h2>

    <div class="form-section">
        <form th:action="@{/tenpo/save}" th:object="${tenpoMaster}" method="post">
            <div class="form-group">
                <label>得意先: </label>
                <select th:field="*{tokuiNo}" required>
                    <option value="">-- 選択してください --</option>
                    <option th:each="t : ${tokuiList}" th:value="${t.tokuiNo}" th:text="${t.tokuiNo + ' : ' + t.tokuiName}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>店舗コード: </label>
                <input type="text" th:field="*{tenpoNo}" required />
            </div>
            <div class="form-group">
                <label>店舗名: </label>
                <input type="text" th:field="*{tenpoName}" required />
            </div>
            <button type="submit">保存する</button>
            <a th:href="@{/tenpo/list}" style="margin-left: 10px;">クリア</a>
        </form>
    </div>

    <h2>店舗一覧</h2>
    <table>
        <thead>
            <tr>
                <th>得意先番号</th>
                <th>店舗コード</th>
                <th>店舗名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tenpo : ${tenpoList}">
                <td th:text="${tenpo.tokuiNo}"></td>
                <td th:text="${tenpo.tenpoNo}"></td>
                <td th:text="${tenpo.tenpoName}"></td>
                <td>
                    <a th:href="@{/tenpo/edit/{id}(id=${tenpo.tenpoNo})}">編集</a>
                    |
                    <a th:href="@{/tenpo/delete/{id}(id=${tenpo.tenpoNo})}" onclick="return confirm('削除しますか？');">削除</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
