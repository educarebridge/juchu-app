<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSVデータ処理 メニュー</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "メイリオ", meiryo, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            color: #fff;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* パワフルな個別配色 */
        .card-upload {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }
        .card-list {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        .card-add {
            background: linear-gradient(135deg, #fc4a1a, #f7b733);
        }

        .card-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .back-btn-container {
            text-align: center;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 35px;
            background-color: #495057;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-back:hover {
            background-color: #6c757d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 CSVデータ連携 センターステーション</h2>

    <!-- 処理完了・エラーメッセージ表示領域（gridの外に配置して崩れを防止） -->
    <div th:if="${message}" style="color: green; font-weight: bold; margin-bottom: 15px;">
        <p th:text="${message}"></p>
    </div>
    <div th:if="${errorMessage}" style="color: red; font-weight: bold; margin-bottom: 15px;">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="grid">
        <!-- CSV選択・入力画面へ -->
        <a th:href="@{/csv/upload}" class="card card-upload">
            <span class="card-icon">📁</span>
            CSVデータ読込み
        </a>

        <!-- 「読込みデータ一覧」ボタン：CSV読込みデータを表示 -->
        <a th:href="@{/order/work-list}" class="card card-list">
            <span class="card-icon">📊</span>
            読込みデータ一覧
        </a>
        
        <!-- 追加登録画面へ -->
        <a th:href="@{/csv/add-form}" class="card card-add">
            <span class="card-icon">➕</span>
            読込みデータ追加
        </a>
    </div>

    <!-- メインメニューに戻る -->
    <div class="back-btn-container">
        <a th:href="@{/}" class="btn-back">⬅ メインメニューに戻る</a>
    </div>
</div>

</body>
</html>
