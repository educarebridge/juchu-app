<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>工事中</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .btn-back:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- static/images/UnderConstruction2.jpg を参照 -->
        <img th:src="@{/images/UnderConstruction2.jpg}" alt="工事中">
        <div>
            <a th:href="@{/}" class="btn-back">戻る</a>
        </div>
    </div>
</body>
</html>
